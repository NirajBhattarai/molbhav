<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Molbhav</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbf8f1;
        --fg: #14172b;
        --muted: #545a6e;
        --primary: #2b3a8f;
        --on-primary: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10132a;
          --fg: #f3f1ea;
          --muted: #a9aec4;
          --primary: #8e9bff;
          --on-primary: #10132a;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-block;
        min-height: 48px;
        line-height: 48px;
        padding: 0 24px;
        border-radius: 12px;
        background: var(--primary);
        color: var(--on-primary);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Molbhav needs a connection to find shops and bargain. Check your network, then try again.
      </p>
      <a href="https://molbhav-eta.vercel.app">Try again</a>
    </main>
  </body>
</html>
