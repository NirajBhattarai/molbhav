; PlatformIO build for the Stall Sign. The same code also builds in the Arduino IDE (see README.md).

[platformio]
src_dir = stall_sign
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
; Bluetooth + Wi-Fi + HTTPS don't fit the default 1.3 MB app partition.
board_build.partitions = huge_app.csv
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit SH110X@2.1.11
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.2.1

; Classic ESP32 (ESP32 DevKit V1 / ESP32-WROOM-32): pio run -e esp32dev -t upload
[env:esp32dev]
board = esp32dev

; ESP32-S3-DevKitC-1: pio run -e esp32-s3-devkitc-1 -t upload
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
